name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Configura JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
  
     
     - name: Scarica Gradle e genera wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -P /tmp
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          chmod +x ./gradlew

      - name: Compila APK (debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Carica APK come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: ScudoChiamate-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
