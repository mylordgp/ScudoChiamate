name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permette di avviare a mano dal sito

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Configura JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configura Android SDK
        uses: android-actions/setup-android@v3

      - name: Dai permessi a Gradle
        run: chmod +x ./gradlew

      - name: Compila APK (debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Carica APK come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: ScudoChiamate-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
